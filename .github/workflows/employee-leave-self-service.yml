name: Employee leave self-service
on:
  pull_request:
    paths:
      - 'js/employee-leave-requests.js'
      - 'js/administrative-space.js'
      - 'js/app.js'
      - 'employee-portal.html'
      - 'supabase/migrations/20261110150000_employee_leave_self_service_approvers.sql'
      - 'supabase/migrations/20261110151000_leave_request_direct_write_lockdown.sql'
      - 'supabase/migrations/20261110152000_employee_leave_request_minimum_table_grants.sql'
      - 'tests/employee-leave-self-service.test.cjs'
      - 'tests/employee-leave-dom.test.cjs'
      - '.github/workflows/employee-leave-self-service.yml'
  workflow_dispatch:
jobs:
  leave-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/administrative-space.js
          node --check js/employee-leave-requests.js
      - name: Self-service and approval regression checks
        run: node --test tests/employee-leave-self-service.test.cjs
      - name: Install isolated DOM test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: Browser DOM tests without database writes
        run: node --test tests/employee-leave-dom.test.cjs
