name: Finance expense category grouping
on:
  pull_request:
    paths:
      - 'js/app.js'
      - 'js/finance-model.js'
      - 'tests/finance-expense-category-grouping.test.cjs'
      - '.github/workflows/finance-expense-category-grouping.yml'
jobs:
  category-grouping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/app.js
      - run: node --check js/finance-model.js
      - run: node --test tests/finance-expense-category-grouping.test.cjs
      - run: node --test tests/finance-unbudgeted-real-lines.test.cjs
      - run: node --test tests/finance-payment-reconciliation.test.cjs
