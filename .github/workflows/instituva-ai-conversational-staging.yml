name: INSTITUVA AI conversational staging guards
on:
  pull_request:
    paths:
      - 'supabase/functions/instituva-ai-assistant/**'
      - 'tests/instituva-ai-conversational-staging.test.mjs'
      - 'tests/instituva-ai-conversational-ui.test.cjs'
      - 'tests/instituva-ai-staging-pilot-gate.test.cjs'
      - 'js/instituva-ai.js'
      - 'asistente-ia.html'
      - '.github/workflows/instituva-ai-conversational-staging.yml'
  workflow_dispatch:
jobs:
  read-only-conversational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test conversational planner and bounded period calculations
        run: node --experimental-strip-types --test tests/instituva-ai-conversational-staging.test.mjs tests/instituva-ai-conversational-ui.test.cjs tests/instituva-ai-staging-pilot-gate.test.cjs
      - name: Staging Edge keeps signed-session access mandatory
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://lonpdmxdvbxuagqxztig.supabase.co/functions/v1/instituva-ai-assistant"
          result=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"mode":"auto","question":"Cuantas horas trabajo Roberto en noviembre"}' "$endpoint")
          test "$result" = "401"
          result=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST -H 'Authorization: Bearer invalid-test-jwt' \
            -H 'Content-Type: application/json' \
            --data '{"mode":"auto","question":"Cuantas horas trabajo Roberto en noviembre"}' "$endpoint")
          test "$result" = "401"
      - name: Preserve production read-only isolation
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/instituva-ai-assistant/index.ts
          grep -q 'authorizedStaffProfiles' supabase/functions/instituva-ai-assistant/index.ts
          grep -q 'assertEmployeeTenantRows' supabase/functions/instituva-ai-assistant/index.ts
          grep -q 'requiredPermissionsForMode' supabase/functions/instituva-ai-assistant/index.ts
          grep -q 'diagnostic_contract:"read_only_v1"' supabase/functions/instituva-ai-assistant/index.ts
