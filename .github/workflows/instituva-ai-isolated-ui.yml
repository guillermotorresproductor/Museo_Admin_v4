name: INSTITUVA AI isolated UI pre-release
on:
  pull_request:
    paths:
      - 'asistente-ia.html'
      - 'administracion.html'
      - 'finanzas.html'
      - 'dashboard.html'
      - 'recursos-humanos.html'
      - 'horarios.html'
      - 'inventario.html'
      - 'notificaciones.html'
      - 'colecciones-museograficas.html'
      - 'reportes.html'
      - 'direccion-ejecutiva.html'
      - 'tests/instituva-ai-cross-module-cache.test.cjs'
      - 'tests/instituva-ai-clean-chat.test.cjs'
      - 'tests/instituva-ai-composer-clear.test.cjs'
      - 'tests/instituva-ai-conversational-ui.test.cjs'
      - 'tests/instituva-ai-conversational-browser.test.cjs'
      - 'js/app.js'
      - 'js/config.js'
      - 'js/instituva-ai*.js'
      - 'css/instituva-ai-dock.css'
      - 'tests/instituva-ai-isolated-release.test.cjs'
      - 'tests/instituva-ai-iframe-startup.test.cjs'
      - 'tests/instituva-ai-frame-cache.test.cjs'
      - 'tests/instituva-ai-conversation-continuity.test.cjs'
      - '.github/workflows/instituva-ai-isolated-ui.yml'
  workflow_dispatch:
jobs:
  security-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application syntax
        run: |
          node --check js/app.js
          node --check js/config.js
          node --check js/instituva-ai.js
          node --check js/instituva-ai-dock.js
      - name: Check isolated UI release guards
        run: node --test tests/instituva-ai-isolated-release.test.cjs tests/instituva-ai-iframe-startup.test.cjs tests/instituva-ai-frame-cache.test.cjs tests/instituva-ai-conversation-continuity.test.cjs tests/instituva-ai-cross-module-cache.test.cjs tests/instituva-ai-clean-chat.test.cjs tests/instituva-ai-composer-clear.test.cjs tests/instituva-ai-conversational-ui.test.cjs

      - name: Exercise real chat DOM with synthetic responses and follow-up context
        run: |
          npm install --no-save --no-package-lock --ignore-scripts jsdom@26
          node --test tests/instituva-ai-conversational-browser.test.cjs

      - name: Verify production Edge rejects requests without a signed session
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://kfokfjngozgcwjpzxcsu.supabase.co/functions/v1/instituva-ai-assistant"
          result=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"mode":"product","question":"Explica el funcionamiento de Instituva"}' "$endpoint")
          echo "No-session HTTP status: $result"
          test "$result" = "401"
          result=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Authorization: Bearer invalid-test-jwt' \
            --header 'Content-Type: application/json' \
            --data '{"mode":"product","question":"Explica el funcionamiento de Instituva"}' "$endpoint")
          echo "Invalid-session HTTP status: $result"
          test "$result" = "401"
