name: INSTITUVA AI tenant-safe diagnostics
on:
  pull_request:
    paths:
      - 'supabase/functions/instituva-ai-assistant/index.ts'
      - 'supabase/functions/instituva-ai-assistant/product-knowledge.ts'
      - 'supabase/functions/instituva-ai-assistant/incident-runbooks.ts'
      - 'supabase/functions/instituva-ai-assistant/incident-runbooks.test.ts'
      - 'supabase/functions/instituva-ai-assistant/tenant-guard.ts'
      - 'supabase/functions/instituva-ai-assistant/tenant-guard.test.ts'
      - 'supabase/migrations/20261125170000_ai_assistant_usage_quota.sql'
      - 'supabase/migrations/20261125194500_ai_assistant_mode_quota.sql'
      - 'js/instituva-ai.js'
      - 'js/app.js'
      - 'asistente-ia.html'
      - 'administracion.html'
      - 'tests/instituva-ai-readonly.test.cjs'
      - 'supabase/tests/instituva-ai-auth-staging.mjs'
      - '.github/workflows/instituva-ai-readonly.yml'
jobs:
  secure-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/instituva-ai.js
      - run: node --check js/app.js
      - run: node --check supabase/tests/instituva-ai-auth-staging.mjs
      - run: node --test tests/instituva-ai-readonly.test.cjs
      - run: node --test tests/external-accountant-readonly.test.cjs
      - run: node --test tests/external-accountant-admin-route.test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/instituva-ai-assistant/index.ts
      - run: deno test supabase/functions/instituva-ai-assistant/incident-runbooks.test.ts
      - run: deno test supabase/functions/instituva-ai-assistant/tenant-guard.test.ts
