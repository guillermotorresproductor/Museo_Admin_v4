<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INSTITUVA | Asistente IA</title>
  <link rel="stylesheet" href="css/main.css?v=20261125-ai">
  <style>
    [data-instituva-ai] { width: 100%; max-width: 1120px; min-width: 0; margin: 0 auto; font-size: 1rem; line-height: 1.55; }
    [data-instituva-ai] button:disabled { opacity: .48; cursor: not-allowed; }
    [data-instituva-ai] .ai-chat-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    [data-instituva-ai] .ai-chat-heading h2 { margin: 0; }
    [data-instituva-ai] .ai-readonly-tag { border: 1px solid #a8d6bf; border-radius: 99px; padding: 3px 10px; font-size: .78rem; color: #17613d; background: #effaf3; }
    [data-instituva-ai] .ai-chat-toolbar { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
    [data-instituva-ai] .ai-chat-toolbar .field { flex: 1 1 290px; margin: 0; }
    [data-instituva-ai] .ai-chat-toolbar .button { flex: 0 0 auto; }
    [data-instituva-ai] .ai-chat-thread { display: flex; flex-direction: column; gap: 18px; min-height: 340px; max-height: min(68vh, 800px); overflow-y: auto; overscroll-behavior: contain; padding: 22px; border: 1px solid #dde5e9; border-radius: 14px; background: #f7f9fb; }
    [data-instituva-ai] [data-ai-history] { display: flex; flex-direction: column; gap: 16px; }
    [data-instituva-ai] .ai-chat-message { max-width: 88%; width: fit-content; overflow-wrap: anywhere; padding: 15px 18px; border-radius: 16px; border: 1px solid #e0e6eb; background: white; font-size: 1rem; box-shadow: 0 1px 3px rgba(17,24,39,.04); }
    [data-instituva-ai] .ai-chat-message--user { align-self: flex-end; border-radius: 16px 16px 4px 16px; background: #e8f3ee; border-color: #c7decf; }
    [data-instituva-ai] .ai-chat-message--assistant { align-self: flex-start; border-radius: 16px 16px 16px 4px; }
    [data-instituva-ai] .ai-chat-speaker { font-weight: 700; color: #344456; font-size: .79rem; margin: 0 0 5px; }
    [data-instituva-ai] .ai-chat-body { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; }
    [data-instituva-ai] .ai-chat-reply { align-self: flex-start; width: min(100%, 940px); max-width: 100%; border: 1px solid #dce6eb; border-radius: 16px 16px 16px 4px; padding: 22px; background: white; font-size: 1.02rem; }
    [data-instituva-ai] .ai-chat-reply h3 { margin-top: 0; }
    [data-instituva-ai] [data-ai-answer] { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; font-size: 1.02rem; }
    [data-instituva-ai] .ai-diagnostic-section { padding: 14px 0 4px; border-top: 1px solid #e8eef1; }
    [data-instituva-ai] .ai-diagnostic-section:first-of-type { border-top: 0; }
    [data-instituva-ai] .ai-diagnostic-section h4 { margin: 0 0 9px; font-size: 1.06rem; font-weight: 800; color: #182b3d; }
    [data-instituva-ai] .ai-diagnostic-section p { margin: 0 0 10px; line-height: 1.75; }
    [data-instituva-ai] .ai-diagnostic-section ol { margin: 0 0 11px; padding-left: 1.6rem; }
    [data-instituva-ai] .ai-diagnostic-section li { margin-bottom: 8px; line-height: 1.65; }
    [data-instituva-ai] .ai-diagnostic-intro { margin: 0 0 12px; color: #455568; font-size: .95rem; line-height: 1.6; }
    [data-instituva-ai] .ai-chat-composer label { font-weight: 800; }
    [data-instituva-ai] .ai-chat-composer textarea { font: inherit; font-size: 1rem; line-height: 1.5; }
    [data-instituva-ai] [data-ai-status] { font-size: .92rem; }
    [data-instituva-ai] [data-ai-choices-list] { display: flex; flex-wrap: wrap; gap: 10px; }
    [data-instituva-ai] .ai-chat-composer { display: flex; flex-direction: column; gap: 8px; }
    [data-instituva-ai] .ai-chat-composer textarea { width: 100%; resize: vertical; min-height: 76px; }
    [data-instituva-ai] .ai-chat-composer-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    [data-instituva-ai] .ai-chat-composer-actions .field-hint { margin: 0; }
    [data-instituva-ai] [data-ai-status] { min-height: 1.3em; }
    [data-instituva-ai] [hidden] { display: none !important; }
    @media (max-width: 640px) {
      [data-instituva-ai] .ai-chat-thread { max-height: 62vh; min-height: 280px; padding: 14px; }
      [data-instituva-ai] .ai-chat-reply { padding: 14px; }
      [data-instituva-ai] .ai-chat-message { max-width: 94%; }
      [data-instituva-ai] .ai-chat-composer-actions .button { width: 100%; }
    }

    /* Presentation-only iframe mode for the authenticated first-party dock. */
    body.ai-embedded-frame { background: #fff; min-height: 0; }
    body.ai-embedded-frame .app-shell { display: block; min-height: 0; }
    body.ai-embedded-frame .sidebar,
    body.ai-embedded-frame .sidebar-backdrop,
    body.ai-embedded-frame .site-header,
    body.ai-embedded-frame .site-footer { display: none !important; }
    body.ai-embedded-frame .main-area { margin: 0 !important; min-height: 0; }
    body.ai-embedded-frame .page-content { padding: 0 !important; max-width: none; }
    body.ai-embedded-frame [data-instituva-ai] {
      max-width: none; height: 100dvh; min-height: 0; overflow: hidden;
      margin: 0; padding: 12px 14px; border: 0; border-radius: 0;
      box-shadow: none; display: flex; flex-direction: column; gap: 8px;
    }
    body.ai-embedded-frame [data-instituva-ai] > p { margin: 0; font-size: .85rem; }
    body.ai-embedded-frame [data-instituva-ai] .ai-chat-heading h2 { font-size: 1.17rem; }
    body.ai-embedded-frame [data-ai-form] {
      display: flex; flex-direction: column; flex: 1 1 auto;
      gap: 9px; margin-top: 4px; min-height: 0; overflow-y: auto;
    }
    body.ai-embedded-frame .ai-chat-toolbar .field { flex-basis: 210px; }
    body.ai-embedded-frame .ai-chat-toolbar { align-items: end; gap: 8px; }
    body.ai-embedded-frame .ai-chat-thread {
      flex: 1 1 180px; min-height: 180px; max-height: none; padding: 12px;
    }
    body.ai-embedded-frame .ai-chat-reply { padding: 15px; }
    body.ai-embedded-frame .ai-chat-composer textarea { min-height: 65px; }
    body.ai-embedded-frame .ai-chat-composer-actions { gap: 6px; }
    body.ai-embedded-frame .ai-chat-composer-actions .field-hint { font-size: .75rem; }

    /* First-party companion window: full conversation area, no duplicate
       museum navigation. Only activated by ?popup=1 in a top-level window. */
    body.ai-popout-window { background: #fff; min-height: 0; }
    body.ai-popout-window .app-shell { display: block; min-height: 0; }
    body.ai-popout-window .sidebar,
    body.ai-popout-window .sidebar-backdrop,
    body.ai-popout-window .site-header,
    body.ai-popout-window .site-footer { display: none !important; }
    body.ai-popout-window .main-area { margin: 0 !important; min-height: 0; }
    body.ai-popout-window .page-content { max-width: none; padding: 0 !important; }
    body.ai-popout-window [data-instituva-ai] {
      display: flex; flex-direction: column; gap: 10px;
      width: 100%; max-width: none; min-height: 0; height: 100dvh;
      margin: 0; padding: 16px; border: 0; border-radius: 0;
      overflow: hidden; box-shadow: none;
    }
    body.ai-popout-window [data-instituva-ai] > p { margin: 0; font-size: .86rem; }
    body.ai-popout-window [data-instituva-ai] [data-ai-form] {
      display: flex; flex-direction: column; flex: 1 1 auto;
      min-height: 0; overflow-y: auto; gap: 10px; margin-top: 4px;
    }
    body.ai-popout-window [data-instituva-ai] .ai-chat-thread {
      flex: 1 1 auto; min-height: 180px; max-height: none; padding: 14px;
    }
    body.ai-popout-window [data-instituva-ai] .ai-chat-reply { padding: 16px; }
    body.ai-popout-window [data-instituva-ai] .ai-chat-composer textarea { min-height: 64px; }
    @media (max-width: 640px) {
      body.ai-popout-window [data-instituva-ai] { padding: 10px 12px; }
      body.ai-popout-window [data-instituva-ai] .ai-chat-heading h2 { font-size: 1.12rem; }
      body.ai-popout-window [data-instituva-ai] .ai-chat-toolbar .field { flex-basis: 190px; }
    }

    /* INSTITUVA AI — private, scope-limited minimalist chat presentation */
    [data-instituva-ai] { --ai-ink:#182a30; --ai-mist:#f7f9f9; --ai-line:#e8eced; --ai-accent:#185d4b;
      color:var(--ai-ink); background:#fff; font:400 14px/1.55 Inter, "Segoe UI", Arial, sans-serif;
      border:0; box-shadow:none; }
    [data-instituva-ai] .ai-chat-heading { padding:4px 0 0; gap:12px; }
    [data-instituva-ai] .ai-chat-heading h2 { font-weight:740; letter-spacing:-.045em; font-size:1.2rem; }
    [data-instituva-ai] .ai-title-accent { color:var(--ai-accent); }
    [data-instituva-ai] .ai-readonly-tag { display:inline-flex; align-items:center; gap:6px;
      border:1px solid var(--ai-line); color:#697c7c; background:#fff; font-size:.69rem;
      font-weight:550; letter-spacing:.01em; padding:4px 9px; }
    [data-instituva-ai] .ai-status-dot { display:inline-block; background:#2b9576; width:6px; height:6px; border-radius:50%; }
    [data-instituva-ai] .ai-chat-toolbar { justify-content:flex-end; padding:0; margin:0; }
    [data-instituva-ai] [data-ai-new-chat] { border:0; background:transparent; box-shadow:none; color:#58736c;
      border-radius:9px; padding:7px 10px; font-size:.78rem; font-weight:600; }
    [data-instituva-ai] [data-ai-new-chat]:hover { background:#f0f5f3; color:#164b3b; }
    [data-instituva-ai] .ai-chat-thread { flex:1 1 auto; gap:12px; border:0;
      border-radius:0; background:#fff; padding:18px 6px 12px; min-height:220px; }
    [data-instituva-ai] [data-ai-history] { gap:15px; }
    [data-instituva-ai] .ai-chat-message { max-width:92%; padding:12px 15px; border:0;
      background:var(--ai-mist); box-shadow:none; border-radius:16px 16px 16px 5px; font-size:.88rem; }
    [data-instituva-ai] .ai-chat-message--user { background:#e9f3ee; border:0;
      border-radius:16px 16px 5px 16px; }
    [data-instituva-ai] .ai-chat-message--assistant { background:#f5f7f7; }
    [data-instituva-ai] .ai-chat-speaker { font-size:.68rem; font-weight:650; color:#688078;
      letter-spacing:.01em; }
    [data-instituva-ai] .ai-chat-body { line-height:1.55; }
    [data-instituva-ai] .ai-chat-reply { border:0; border-left:2px solid #d4e8df;
      border-radius:0 12px 12px 0; box-shadow:none; padding:12px 14px; font-size:.9rem;
      background:#fbfcfc; width:100%; }
    [data-instituva-ai] .ai-result-heading { font-size:.76rem; color:var(--ai-accent);
      letter-spacing:.01em; font-weight:700; margin:0 0 8px; }
    [data-instituva-ai] [data-ai-answer] { font-size:.89rem; line-height:1.64; }
    [data-instituva-ai] .ai-diagnostic-section { border-top:1px solid #edf0ef; padding:12px 0 1px; }
    [data-instituva-ai] .ai-diagnostic-section h4 { font-size:.88rem; font-weight:700;
      color:#2d4942; margin:0 0 6px; }
    [data-instituva-ai] .ai-diagnostic-section p,
    [data-instituva-ai] .ai-diagnostic-section li { font-size:.86rem; line-height:1.6; }
    [data-instituva-ai] .ai-chat-composer { padding:10px 0 2px; gap:8px;
      border-top:1px solid var(--ai-line); background:#fff; }
    [data-instituva-ai] .ai-chat-composer textarea { min-height:56px !important; max-height:160px;
      padding:13px 15px; border:1px solid #dae4df; background:#fafcfb;
      border-radius:13px; box-shadow:none; font-size:.88rem; line-height:1.45; resize:vertical; color:var(--ai-ink); }
    [data-instituva-ai] .ai-chat-composer textarea:focus { outline:2px solid #c6e4d8;
      outline-offset:1px; border-color:#72b598; background:white; }
    [data-instituva-ai] .ai-chat-composer-actions { justify-content:flex-end; }
    [data-instituva-ai] .ai-chat-composer-actions .submit-button { width:auto; min-width:100px;
      background:#185b46; border:0; border-radius:10px; color:white; padding:9px 14px;
      font-weight:650; font-size:.79rem; box-shadow:none; }
    [data-instituva-ai] .ai-chat-composer-actions .submit-button:hover { background:#104732; }
    [data-instituva-ai] .submit-button span { margin-left:8px; font-size:1rem; }
    [data-instituva-ai] [data-ai-status] { min-height:0; margin:0; color:#72817f; font-size:.75rem; }
    [data-instituva-ai] [data-ai-sources-details] { margin-top:12px; border-top:1px solid var(--ai-line);
      padding-top:9px; font-size:.76rem; color:#597169; }
    [data-instituva-ai] [data-ai-sources-details] summary { cursor:pointer; }
    [data-instituva-ai] .ai-visually-hidden { position:absolute; width:1px; height:1px;
      padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    body.ai-embedded-frame [data-instituva-ai] { padding:12px 16px 9px; gap:4px; }
    body.ai-embedded-frame [data-ai-form] { gap:5px; margin-top:0; overflow:hidden; }
    body.ai-embedded-frame .ai-chat-thread { padding:14px 2px 8px; min-height:130px; overflow-y:auto; }
    body.ai-embedded-frame .ai-chat-reply { padding:12px; }
    body.ai-embedded-frame .ai-chat-heading h2 { font-size:1.1rem; }
    body.ai-popout-window [data-instituva-ai] { padding:24px max(24px, calc((100vw - 930px)/2)); }
    body.ai-popout-window [data-ai-form] { overflow:hidden; }
    body.ai-popout-window .ai-chat-thread { overflow-y:auto; }
    @media (max-width:640px) {
      [data-instituva-ai] .ai-chat-message { max-width:96%; }
      [data-instituva-ai] .ai-chat-composer-actions .submit-button { width:auto; }
      body.ai-popout-window [data-instituva-ai] { padding:12px; }
    }
  </style>
  <script>
    // Fail visibly and closed if an authenticated assistant cannot initialize.
    // No user data, auth tokens or service configuration are exposed.
    (function () {
      window.setTimeout(function () {
        if (document.body?.classList.contains("app-ready")) return;
        const main = document.querySelector(".page-content");
        if (!main) return;
        const section = document.createElement("section");
        section.className = "card panel";
        const title = document.createElement("h2");
        title.textContent = "No se pudo abrir INSTITUVA AI";
        const info = document.createElement("p");
        info.textContent = "El chat no terminó de inicializarse. Cierra el panel, actualiza el Dashboard y vuelve a abrirlo. Si persiste, informa al administrador.";
        section.append(title, info);
        main.replaceChildren(section);
        document.body.classList.add("app-ready");
      }, 12000);
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>
    <div class="sidebar-backdrop" data-sidebar-backdrop></div>
    <div class="main-area">
      <header class="site-header" data-header></header>
      <main class="page-content">
        <section class="card panel section-stack" data-instituva-ai>
          
          <div class="ai-chat-heading">
            <h2>INSTITUVA <span class="ai-title-accent">AI</span></h2>
            <span class="ai-readonly-tag"><span class="ai-status-dot" aria-hidden="true"></span> Solo lectura</span>
          </div>
          <form class="form-grid" data-ai-form>
            <div class="ai-chat-toolbar" style="justify-content:flex-end">
              <input type="hidden" name="mode" value="auto">
              <button type="button" class="button secondary" data-ai-new-chat>Nueva conversación</button>
            </div>
            <!-- Legacy form inputs are retained only as internal compatibility nodes.
                 Natural language is interpreted server-side; nothing is requested in fields. -->
            <div data-ai-private hidden style="display:none">
              <input name="employee_name" type="text">
              <input name="day" type="date">
            </div>
            <div data-ai-schedules hidden style="display:none">
              <input name="start_day" type="date">
            </div>
            <div data-ai-finance hidden style="display:none">
              <input name="year" type="number">
            </div>
            <div class="ai-chat-thread" data-ai-thread role="log" aria-label="Conversación temporal con INSTITUVA">
              <div data-ai-history>
                <article class="ai-chat-message ai-chat-message--assistant" data-ai-welcome>
                  <p class="ai-chat-speaker">INSTITUVA AI</p>
                  <p class="ai-chat-body">¿En qué puedo ayudarte?</p>
                </article>
              </div>
              <section class="ai-chat-reply section-stack" data-ai-employee-choices hidden>
                <h3>INSTITUVA AI</h3>
                <p data-ai-choices-question></p>
                <div data-ai-choices-list></div>
                <p class="field-hint">Solo empleados autorizados de tu museo. Seleccionar un nombre no modifica registros.</p>
              </section>
              <section class="ai-chat-reply section-stack" data-ai-result hidden>
                <h3 class="ai-result-heading">INSTITUVA AI</h3>
                <div data-ai-answer></div>
                <div data-ai-answer-formatted hidden></div>
                <p class="field-hint" data-ai-evidence></p>
                <details class="field-hint" data-ai-sources-details hidden>
                  <summary>Fuentes documentales consultadas</summary>
                  <ul data-ai-sources></ul>
                </details>
              </section>
            </div>
            <div class="ai-chat-composer">
              <label for="ai-question" class="ai-visually-hidden">Escribe tu mensaje</label>
              <textarea id="ai-question" name="question" rows="2" minlength="2" maxlength="1000" required placeholder="Pregunta lo que necesites sobre tu museo..."></textarea>
              <div class="ai-chat-composer-actions">
                <button type="submit" class="button submit-button" aria-label="Enviar mensaje">Enviar <span aria-hidden="true">↑</span></button>
              </div>
            </div>
            <p class="form-message" role="status" data-ai-status></p>
          </form>
        </section>
      </main>
      <footer class="site-footer" data-footer></footer>
    </div>
  </div>
  <script src="js/config.js?v=20261126-ai-frame-3"></script>
  <script src="js/time-format.js?v=us-time-20261028"></script>
  <script src="js/services/supabase.js?v=external-accountant-20261123"></script>
  <script src="js/instituva-ai.js?v=20261127-payroll-comparison-1"></script>
  <script src="js/app.js?v=20261126-ai-frame-3"></script>
</body>
</html>
