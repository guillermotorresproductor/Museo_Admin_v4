<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museo Admin v4.0 | Finanzas</title>
  <link rel="stylesheet" href="css/main.css?v=employee-sensitive-20260721">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>
    <div class="sidebar-backdrop" data-sidebar-backdrop></div>
    <div class="main-area">
      <header class="site-header" data-header></header>
      <main class="page-content">
        <section class="finance-gate card panel" data-finance-gate>
          <span class="module-icon theme-teal" data-icon="dollar"></span>
          <h3>Acceso a Finanzas</h3>
          <p class="form-message" data-finance-login-message></p>
          <form class="form-grid finance-login" data-finance-login hidden>
            <div class="field">
              <label for="finance-email">Correo electrónico</label>
              <input id="finance-email" name="email" type="email" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="finance-password">Contraseña</label>
              <input id="finance-password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button submit-button" type="submit">Confirmar acceso</button>
          </form>
          <a class="button submit-button" data-finance-login-fallback href="login.html">Entrar a mi cuenta</a>
        </section>

        <section class="finance-module" data-finance-module hidden>
          <div class="finance-toolbar">
            <div>
              <p class="page-kicker">Finanzas v1</p>
              <h2>Presupuesto anual</h2>
              <p>Período presupuestario del 1 de septiembre de 2026 al 31 de agosto de 2027.</p>
            </div>
            <div class="finance-sync-status is-checking" data-finance-sync-status>
              <span class="sync-dot" aria-hidden="true"></span>
              <div>
                <strong data-finance-sync-title>Conectando con Instituva</strong>
                <span data-finance-sync-detail>Consultando el presupuesto oficial.</span>
              </div>
            </div>
          </div>
          <p class="form-message" data-finance-message aria-live="polite"></p>
          <section class="card panel finance-v1-panel" data-finance-panel></section>
        </section>
      </main>
      <footer class="site-footer" data-footer></footer>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/services/supabase.js?v=pr31-access-91849c8"></script>
  <script src="js/app.js?v=pr31-denied-view-20260906"></script>
</body>
</html>
