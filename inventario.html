<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museo Admin v4.0 | Inventario</title>
  <link rel="stylesheet" href="css/main.css?v=inventory-v1-20260901">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>
    <div class="sidebar-backdrop" data-sidebar-backdrop></div>
    <div class="main-area">
      <header class="site-header" data-header></header>
      <main class="page-content">
        <section class="card panel inventory-panel section-stack">
          <div class="inventory-list-header">
            <div>
              <p class="page-kicker">Listado Automático</p>
              <h3>Artículos Registrados</h3>
              <p><strong data-inventory-total>0</strong> artículos registrados</p>
            </div>
          </div>

          <div class="inventory-controls">
            <label class="field" for="inventory-search">
              <span>Buscar</span>
              <input id="inventory-search" type="search" placeholder="Nombre, sello, serie, marca, modelo o responsable" data-inventory-search>
            </label>

            <label class="field" for="inventory-filter-location">
              <span>Filtrar por ubicación</span>
              <select id="inventory-filter-location" data-inventory-filter-location>
                <option value="">Todas las ubicaciones</option>
              </select>
            </label>

            <label class="field" for="inventory-filter-status">
              <span>Filtrar por estado</span>
              <select id="inventory-filter-status" data-inventory-filter-status>
                <option value="">Todos los estados</option>
              </select>
            </label>

            <label class="inventory-archive-filter" for="inventory-show-archived">
              <input id="inventory-show-archived" type="checkbox" data-inventory-show-archived>
              <span>Mostrar equipos archivados</span>
            </label>
          </div>

          <div class="table-wrap">
            <table class="data-table inventory-table">
              <thead>
                <tr>
                  <th>Foto</th>
                  <th><button type="button" data-inventory-sort="name">Equipo</button></th>
                  <th><button type="button" data-inventory-sort="asset_tag">Sello / Serie</button></th>
                  <th><button type="button" data-inventory-sort="location">Ubicación / Responsable</button></th>
                  <th><button type="button" data-inventory-sort="condition">Condición / Estado</button></th>
                  <th><button type="button" data-inventory-sort="updated_at">Actualizado</button></th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody data-inventory-list>
                <tr>
                  <td colspan="7">No hay equipos registrados.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="card panel inventory-panel" data-inventory-entry-panel>
          <div class="inventory-entry-header">
            <div>
              <p class="page-kicker">Entrada de Inventario</p>
              <h3 data-inventory-form-title>Registro de Equipos</h3>
              <p>Un registro corresponde a un solo equipo físico.</p>
            </div>
          </div>

          <form id="inventory-form" class="application-form" novalidate>
            <input type="hidden" id="inventory-id" name="id">
            <input type="hidden" id="inventory-version" name="version">

            <div class="form-row">
              <label class="field" for="inventory-name">
                <span>Nombre del artículo</span>
                <input id="inventory-name" name="name" type="text" maxlength="160" required>
              </label>

              <label class="field" for="inventory-tag">
                <span>Número de sello (Asset Tag)</span>
                <input id="inventory-tag" name="asset_tag" type="text" maxlength="80" required>
              </label>
            </div>

            <label class="field" for="inventory-description">
              <span>Descripción</span>
              <textarea id="inventory-description" name="description" rows="3" maxlength="2000" required></textarea>
            </label>

            <div class="form-row">
              <label class="field" for="inventory-category">
                <span>Categoría</span>
                <input id="inventory-category" name="category" type="text" maxlength="100" required>
              </label>
              <label class="field" for="inventory-serial">
                <span>Número de serie</span>
                <input id="inventory-serial" name="serial_number" type="text" maxlength="120">
              </label>
            </div>

            <div class="form-row form-row-three">
              <label class="field" for="inventory-brand">
                <span>Marca</span>
                <input id="inventory-brand" name="brand" type="text" maxlength="100">
              </label>
              <label class="field" for="inventory-model">
                <span>Modelo</span>
                <input id="inventory-model" name="model" type="text" maxlength="100">
              </label>
              <label class="field" for="inventory-quantity">
                <span>Cantidad</span>
                <input id="inventory-quantity" name="quantity" type="number" value="1" min="1" max="1" readonly>
              </label>
            </div>

            <div class="form-row form-row-three">
              <label class="field" for="inventory-purchase-order">
                <span>Orden de compra</span>
                <input id="inventory-purchase-order" name="purchase_order" type="text" maxlength="100">
              </label>
              <label class="field" for="inventory-supplier">
                <span>Suplidor</span>
                <input id="inventory-supplier" name="supplier" type="text" maxlength="160">
              </label>
              <label class="field" for="inventory-received-date">
                <span>Fecha recibida</span>
                <input id="inventory-received-date" name="received_date" type="date">
              </label>
            </div>

            <div class="form-row form-row-three">
              <label class="field" for="inventory-cost">
                <span>Costo</span>
                <input id="inventory-cost" name="cost" type="number" min="0" step="0.01" inputmode="decimal">
              </label>
              <label class="field" for="inventory-condition">
                <span>Condición</span>
                <select id="inventory-condition" name="condition" required>
                  <option value="">Seleccione...</option>
                  <option value="excelente">Excelente</option>
                  <option value="buena">Buena</option>
                  <option value="regular">Regular</option>
                  <option value="necesita_reparacion">Necesita reparación</option>
                  <option value="fuera_de_servicio">Fuera de servicio</option>
                </select>
              </label>
              <label class="field" for="inventory-location">
                <span>Ubicación</span>
                <select id="inventory-location" name="location" required>
                  <option value="">Seleccione una ubicación...</option>
                  <option>Almacén 1</option>
                  <option>Almacén 2</option>
                  <option>Almacén 3</option>
                  <option>Lobby</option>
                  <option>Mezzanine Raíces</option>
                  <option>Cine Bienvenida</option>
                  <option>Altar del Cuatro</option>
                  <option>Pasillo de Instrumentos</option>
                  <option>Sala Clásica</option>
                  <option>Sala Bailable</option>
                  <option>Escalera de Subida</option>
                  <option>Pasillo Alternativo</option>
                  <option>Sala Romántica</option>
                  <option>Sala Urbana</option>
                  <option>Salón Experimental Guaynabo</option>
                  <option>Área Foyer</option>
                  <option>Sala Itinerante (Ball Room)</option>
                </select>
              </label>

            </div>

            <div class="form-row form-row-three">
              <label class="field" for="inventory-responsible">
                <span>Responsable</span>
                <input id="inventory-responsible" name="responsible" type="text" maxlength="160">
              </label>
              <label class="field" for="inventory-status">
                <span>Estado</span>
                <select id="inventory-status" name="status" required>
                  <option value="">Seleccione un estado...</option>
                  <option value="activo">Activo</option>
                  <option value="en_reparacion">En reparación</option>
                  <option value="prestado">Prestado</option>
                  <option value="retirado">Retirado</option>
                </select>
              </label>
              <label class="field" for="inventory-warranty">
                <span>Garantía</span>
                <input id="inventory-warranty" name="warranty" type="text" maxlength="300" placeholder="Vigencia o detalles">
              </label>
            </div>

            <div class="inventory-photo-field">
              <label class="field" for="inventory-photo">
                <span>Fotografía del equipo</span>
                <input id="inventory-photo" name="photo" type="file" accept=".jpg,.jpeg,.png,.heic,.heif,.webp,image/jpeg,image/png,image/heic,image/heif,image/webp">
                <small>JPG, PNG, HEIC o WebP; máximo 10 MB y mínimo 800×600. Se guardará como WebP de 500 KB o menos.</small>
              </label>
              <div class="inventory-photo-preview" data-inventory-photo-preview>
                <span>Sin fotografía seleccionada</span>
              </div>
            </div>

            <div class="inventory-actions">
              <button class="button submit-button" type="submit" data-inventory-submit>Registrar equipo</button>
              <button class="button secondary" type="button" data-inventory-cancel hidden>Cancelar edición</button>
            </div>
            <p class="form-message" data-inventory-message></p>
          </form>
        </section>
      </main>
      <dialog class="inventory-detail-dialog" data-inventory-detail-dialog>
        <div data-inventory-detail></div>
        <div class="inventory-actions"><button class="button secondary" type="button" data-inventory-detail-close>Cerrar</button></div>
      </dialog>
      <footer class="site-footer" data-footer></footer>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/inventory-image.js?v=inventory-v1-20260901"></script>
  <script src="js/services/supabase.js?v=inventory-v1-20260901"></script>
  <script src="js/app.js?v=inventory-v1-20260901"></script>
</body>
</html>
