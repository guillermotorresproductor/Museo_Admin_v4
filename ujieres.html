<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museo Admin v4.0 | Ujieres</title>
  <link rel="stylesheet" href="css/main.css?v=usher-portal-card-20260731">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>
    <div class="sidebar-backdrop" data-sidebar-backdrop></div>
    <div class="main-area">
      <header class="site-header" data-header></header>
      <main class="page-content">
        <section class="card panel calendar-panel" data-calendar-module="ushers">
          <div class="calendar-toolbar">
            <div>
              <p class="page-kicker">Calendario de Ujieres</p>
              <h3 data-calendar-title>Calendario de Ujieres</h3>
              <p>Asignaciones de ujieres por mes, semana o día, con entrada, salida y área.</p>
            </div>
            <div class="calendar-actions usher-calendar-actions">
              <a class="button secondary usher-portal-back" data-usher-portal-back hidden href="employee-portal.html">Volver a Mi jornada</a>
              <div class="usher-view-switch" role="group" aria-label="Vista del calendario">
                <button class="button secondary is-active" type="button" data-usher-view="month">Mes</button>
                <button class="button secondary" type="button" data-usher-view="week">Semana</button>
                <button class="button secondary" type="button" data-usher-view="day">Día</button>
              </div>
              <button class="button secondary" type="button" data-calendar-prev>Anterior</button>
              <button class="button secondary" type="button" data-calendar-today>Hoy</button>
              <button class="button secondary" type="button" data-calendar-next>Siguiente</button>
              <button class="button submit-button" type="button" data-calendar-new>Nueva Entrada</button>
            </div>
          </div>

          <label class="field usher-day-picker" data-usher-day-picker hidden>
            <span>Fecha</span>
            <input type="date" data-usher-day-input>
          </label>

          <div class="monthly-calendar" data-calendar-grid></div>

          <form class="calendar-form" data-calendar-form hidden>
            <input type="hidden" name="id">
            <div class="form-row form-row-three">
              <label class="field">
                <span>Día</span>
                <input type="date" name="fecha" required>
              </label>
              <label class="field">
                <span>Hora de entrada</span>
                <input type="time" name="horaEntrada" required>
              </label>
              <label class="field">
                <span>Hora de salida</span>
                <input type="time" name="horaSalida" required>
              </label>
            </div>
            <div class="form-row">
              <label class="field">
                <span>Nombre del ujier</span>
                <select name="employee_id" data-usher-select required>
                  <option value="">Seleccione un ujier...</option>
                </select>
              </label>
              <label class="field">
                <span>Área del Museo</span>
                <select name="area" data-area-select required>
                  <option value="">Seleccione un área...</option>
                </select>
              </label>
            </div>
            <div class="inventory-actions">
              <button class="button submit-button" type="submit" data-calendar-submit>Guardar Asignación</button>
              <button class="button secondary" type="button" data-calendar-cancel hidden>Cancelar edición</button>
            </div>
            <p class="form-message" data-calendar-message></p>
          </form>
        </section>
      </main>
      <footer class="site-footer" data-footer></footer>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/services/supabase.js?v=usher-portal-card-20260731"></script>
  <script src="js/usher-schedule-core.js?v=usher-portal-card-20260731"></script>
  <script src="js/app.js?v=usher-portal-card-20260731"></script>
</body>
</html>
